<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Detlefs Campingplätze</title>
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>

<div id="container">
    <aside id="sidebar">
        <h2>Meine Campingplätze</h2>
        <ul id="camping-list"></ul>
    </aside>

    <main id="main">
        <div id="map"></div>
        <div id="info">
            <h2>Bitte einen Campingplatz auswählen</h2>
            <p>Links in der Liste oder direkt auf der Karte klicken.</p>
        </div>
    </main>
</div>

<script src="script.js"></script>
</body>
</html>
